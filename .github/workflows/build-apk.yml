name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The repo may not have a package-lock.json yet (it is created here and committed on the first run).
      - name: Ensure package-lock.json
        run: test -f package-lock.json || npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Add Android platform (first run only)
        id: android
        run: |
          if [ ! -d android ]; then
            npx cap add android
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch Android project (portrait, minSdk 24, camera, icon)
        run: node scripts/patch-android.mjs

      - name: Commit android/ folder (first run only)
        if: steps.android.outputs.created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android package-lock.json
          git commit -m "Add Android project and lockfile [skip ci]" || echo "Nothing to commit"
          git push || echo "Push failed (branch protection?). Commit the android/ folder yourself."

      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: pathhelp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ---- Optional: signed release APK (only when all four secrets exist) ----
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "Signing secrets not set - skipping the signed release build."
          fi

      - name: Build and sign release APK
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          (cd android && ./gradlew assembleRelease --no-daemon)
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          IN="$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)"
          OUT="$RUNNER_TEMP/app-release-signed.apk"
          "$BT/zipalign" -p -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "$OUT"
          mkdir -p release-out && cp "$OUT" release-out/pathhelp-release.apk

      - name: Upload signed release APK
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pathhelp-release-apk
          path: release-out/pathhelp-release.apk
          if-no-files-found: error
